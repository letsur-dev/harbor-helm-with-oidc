name: Release Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in Chart.yaml
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s/^version:.*/version: \"${VERSION}\"/" Chart.yaml

      - name: Package chart
        run: helm package .

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            harbor-${{ steps.version.outputs.value }}.tgz \
            --title "harbor-${{ steps.version.outputs.value }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update gh-pages index
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          gh release download "${{ github.ref_name }}" \
            --pattern "*.tgz" --dir .

          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ -f index.yaml ]; then
            helm repo index . --url "$REPO_URL" --merge index.yaml
          else
            helm repo index . --url "$REPO_URL"
          fi

          git add index.yaml *.tgz
          git commit -m "Release harbor-${{ steps.version.outputs.value }}"
          git push origin gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
